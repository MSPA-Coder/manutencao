# Sem dependências de linguagem: o código executado é Bash e a configuração de
# produção é Nginx e systemd. O Compose da CI centraliza ShellCheck e Nginx;
# o `pull_policy` sempre busca a tag móvel. O Dependabot acompanha mudanças nas
# tags de compatibilidade e nas ações do GitHub toda semana.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: "/.github"
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
