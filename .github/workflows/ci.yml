name: CI

on:
  push:
    branches:
      - main
  # Sem filtro de `branches`, de proposito: assim a verificacao roda em PR para
  # QUALQUER base, e nao so para `main`.
  #
  # Com o filtro, um PR empilhado sobre outro branch nao disparava check
  # nenhum -- e o sintoma e a ausencia de sinal, nao um vermelho: a pagina do
  # PR fica limpa e parece aprovada. Aconteceu na fase F1.
  #
  # O `push` acima continua restrito a `main`: o que interessa la e o estado
  # do branch que a producao espelha.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    # `Qualidade` é o nome exigido pelo ruleset do `main` como status check
    # obrigatório. Renomear o job derruba a proteção do branch em silêncio.
    name: Qualidade
    # Fixado, e não `ubuntu-latest`: o `latest` migra de imagem sem aviso e
    # muda ferramenta debaixo do teste. Os outros repositórios já usavam a
    # forma fixa; este era o único fora.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O `bash -n` continua aqui mesmo com o ShellCheck abaixo, e não é
      # redundância: ele usa o parser do próprio bash, enquanto o ShellCheck
      # usa um parser independente. Onde os dois divergirem, quem manda no
      # servidor é o bash.
      - name: Validar sintaxe dos scripts Bash
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find vps -type f -name '*.sh' -print0)

      # RODA COMO CONTÊINER, NÃO COMO ACTION -- mesma política dos repositórios
      # irmãos: `allowed_actions: selected` com apenas `github_owned_allowed`.
      # Uma action de terceiro é barrada antes de o workflow rodar, e o sintoma
      # é `startup_failure` sem log nenhum.
      #
      # Imagem fixada por digest, pelo mesmo motivo que as actions são fixadas
      # por SHA.
      #
      # REPROVA EM QUALQUER ACHADO, de propósito. As exceções que existem hoje
      # são treze `# shellcheck disable=` no código, cada uma com o motivo
      # escrito ao lado -- decisão explícita, no lugar onde ela se aplica, em
      # vez de um vermelho permanente que se aprende a ignorar.
      - name: Analisar os scripts com ShellCheck
        run: |
          set -euo pipefail
          find vps -type f -name '*.sh' -print0 \
            | xargs -0 docker run --rm \
                -v "$PWD:/mnt:ro" -w /mnt \
                koalaman/shellcheck-alpine:v0.10.0@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
                shellcheck -f gcc

      # `nginx -t` sobre os vhosts versionados, num andaime com certificados
      # autoassinados. Até aqui, o primeiro a descobrir um erro de sintaxe ou
      # um `include` quebrado era o servidor de produção.
      #
      # A imagem é `1.24` porque é a versão do Ubuntu 24.04 do VPS, e é a
      # compatibilidade que os vhosts declaram ao usar `listen ... ssl http2`.
      # Ver o cabeçalho de `vps/tests/nginx_test.sh`.
      - name: Conferir a configuração do Nginx
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            nginx:1.24@sha256:f6daac2445b0ce70e64d77442ccf62839f3f1b4c24bf6746a857eff014e798c8 \
            sh /repo/vps/tests/nginx_test.sh

      - name: Testar o deploy
        run: bash vps/tests/deploy_test.sh

      # O instalador tinha suíte hermética desde que foi escrito, mas ela nunca
      # havia sido ligada à CI -- rodava só quando alguém lembrava.
      - name: Testar o instalador
        run: bash vps/tests/instalar_test.sh

      # O sentinela lê o log de 5xx do nginx e alerta quebra de aplicação. A
      # suíte substitui o `alerta.sh` por um script falso, então nada sai para
      # o Telegram; o que ela exercita é a leitura incremental, que é onde
      # mora o risco -- perder linha ou realertar o que já foi drenado.
      - name: Testar o sentinela de 5xx
        run: bash vps/tests/sentinela_test.sh

      # O backup descobre os bancos do Docker em vez de os listar (13/09/2026).
      # A suíte substitui o `docker` por um script falso e exercita o critério
      # da descoberta, a guarda de "descobri zero" e o aviso de banco que sumiu.
      # O risco que ela cobre é o pior que um backup pode ter: não salvar nada
      # e terminar dizendo que deu certo.
      - name: Testar a descoberta do backup
        run: bash vps/tests/backup-db_test.sh

      # O expurgo de contatos cumpre o prazo que o aviso de privacidade do
      # portal publica. A suíte substitui o `docker` por um script falso e
      # exercita os dois sentidos do vazio: máquina sem o portal (sucesso) e
      # portal sem contêiner para rodar o expurgo (falha, que alerta).
      - name: Testar o expurgo de contatos
        run: bash vps/tests/expurgo-contatos_test.sh

      # O aviso de chegada do portal guarda o último instante avisado e manda
      # alerta com `ALERTA_JANELA=0`. A suíte cobre a primeira execução (só
      # inicializa), o estado que não anda quando algo falha e a leitura
      # exclusiva da saída padrão do comando.
      - name: Testar o aviso de chegada do portal
        run: bash vps/tests/aviso-contatos_test.sh

      # A cópia dos dumps para fora do servidor começa por `listar`, que grava
      # o marcador `.ultima_busca`. A suíte prova que só `listar` grava e que a
      # listagem não depende de conseguir gravar.
      - name: Testar o agente de backup
        run: bash vps/tests/backup-agent_test.sh

      # O vigia alerta quando ninguém busca os backups há mais de 72h -- a
      # tarefa do Windows que faz a busca já parou três vezes sem aviso. A
      # suíte cobre só essa verificação; o resto do vigia depende de rede.
      - name: Testar a busca no vigia
        run: bash vps/tests/vigia_test.sh
