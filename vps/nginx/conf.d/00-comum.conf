# Configuração comum aos quatro vhosts. Vai em /etc/nginx/conf.d/, que o
# nginx.conf do Ubuntu já inclui dentro do bloco `http`.
#
# O prefixo `00-` garante que `map` e `limit_req_zone` sejam lidos antes dos
# `sites-enabled/*` que os usam — a ordem do include importa.

# ---------------------------------------------------------------------------
# Compressão
#
# O `nginx.conf` do Ubuntu já traz `gzip on;`, mas com `gzip_types` comentado.
# O padrão do nginx quando não há `gzip_types` é comprimir SÓ `text/html`, ou
# seja: a diretiva estava ligada e o CSS, o JS e o JSON saíam sem compressão
# nenhuma. Parecia resolvido e não estava.
# ---------------------------------------------------------------------------
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/wasm;
# Fonte woff2 fica de fora de propósito: já é comprimida internamente, e
# passar gzip por cima gasta CPU para às vezes crescer o arquivo.

# ---------------------------------------------------------------------------
# Limitador de taxa no login
#
# POR QUE AQUI E NÃO NA APLICAÇÃO: os três Flask usam `flask-limiter` com
# armazenamento `memory://`, que é contador por processo. Com `gunicorn
# --workers 2` o limite efetivo é o dobro do escrito, e todo deploy zera a
# contagem — ou seja, a proteção contra força bruta some exatamente quando o
# serviço reinicia. O nginx é compartilhado por definição e sobrevive ao
# deploy dos aplicativos.
#
# POR QUE A CHAVE PASSA POR UM `map`: limitar `location /login` inteiro
# contaria também o GET que só desenha o formulário, e recarregar a página de
# login viraria bloqueio. O `map` devolve chave VAZIA para tudo que não é
# POST, e o `limit_req` ignora requisição de chave vazia — então a tela abre à
# vontade e só a tentativa de autenticar é contada.
#
# CALIBRAÇÃO: 10r/m com burst de 5 sem atraso. Um humano que erra a senha
# cinco vezes seguidas não percebe nada; um script fica preso a uma tentativa
# a cada 6 segundos. O risco registrado no plano é o oposto — limitador mal
# calibrado tranca o próprio dono — e é por isso que o burst existe.
# ---------------------------------------------------------------------------
map $request_method $chave_login {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $chave_login zone=login:10m rate=10r/m;

# 429 diz "tente de novo mais devagar"; o padrão 503 diz "o servidor quebrou",
# que é diagnóstico errado e manda o dono procurar defeito onde não há.
limit_req_status 429;
