# Configuração comum aos quatro vhosts. Vai em /etc/nginx/conf.d/, que o
# nginx.conf do Ubuntu já inclui dentro do bloco `http`.
#
# O prefixo `00-` garante que `map` e `limit_req_zone` sejam lidos antes dos
# `sites-enabled/*` que os usam — a ordem do include importa.

# ---------------------------------------------------------------------------
# Compressão
#
# O `nginx.conf` do Ubuntu já traz `gzip on;`, mas com `gzip_types` comentado.
# Sem `gzip_types`, o padrão do Nginx comprime apenas `text/html`; esta lista
# inclui os demais tipos textuais servidos pelas aplicações.
# ---------------------------------------------------------------------------
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/wasm;
# Fonte woff2 fica de fora de propósito: já é comprimida internamente, e
# passar gzip por cima gasta CPU para às vezes crescer o arquivo.

# ---------------------------------------------------------------------------
# Limitador de taxa no login
#
# POR QUE AQUI E NÃO NA APLICAÇÃO: os três Flask usam `flask-limiter` com
# armazenamento `memory://`, que é contador por processo. Com `gunicorn
# --workers 2` o limite efetivo é o dobro do escrito, e todo deploy zera a
# contagem. O Nginx fornece o contador compartilhado e independente do ciclo
# de vida dos aplicativos.
#
# POR QUE A CHAVE PASSA POR UM `map`: limitar `location /login` inteiro
# contaria também o GET que só desenha o formulário, e recarregar a página de
# login viraria bloqueio. O `map` devolve chave VAZIA para tudo que não é
# POST, e o `limit_req` ignora requisição de chave vazia — então a tela abre à
# vontade e só a tentativa de autenticar é contada.
#
# CALIBRAÇÃO: 10r/m com burst de 5 sem atraso permite uma sequência curta de
# erros humanos e limita tentativas automatizadas sustentadas.
# ---------------------------------------------------------------------------
map $request_method $chave_login {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $chave_login zone=login:10m rate=10r/m;

# 429 diz "tente de novo mais devagar"; o padrão 503 diz "o servidor quebrou",
# que é diagnóstico errado e manda o dono procurar defeito onde não há.
limit_req_status 429;

# ---------------------------------------------------------------------------
# Registro separado de erro de servidor (5xx)
#
# O QUE ISTO RESOLVE. O monitoramento existente cobre QUEDA: `vigia.sh` bate
# no `/health`, o UptimeRobot bate de fora, o `OnFailure=` avisa unidade que
# falhou. Nada disso cobre QUEBRA. Uma rota que devolve 500 para todo mundo
# mantém o `/health` verde, porque `/health` consulta o banco e o banco está
# bem. O erro vira linha em `docker logs`, com rotação, e ninguém é avisado.
#
# POR QUE NO NGINX E NÃO NUM HANDLER DENTRO DE CADA APLICAÇÃO. O nginx conhece
# o status real de TODA resposta, inclusive as que aplicação nenhuma consegue
# relatar sobre si mesma: worker do gunicorn que morreu (502) e requisição que
# estourou o tempo (504). Um handler de 500 só é executado quando o processo
# ainda está vivo o bastante para executá-lo -- justamente o caso menos grave.
# Além disso, aqui a cobertura vale para os cinco vhosts de uma vez, sem
# release da biblioteca compartilhada nem alteração em quatro repositórios.
#
# O `if=` grava SOMENTE as respostas 5xx num arquivo próprio. Quem lê não
# precisa varrer o access log inteiro nem adivinhar formato: toda linha do
# arquivo já é um incidente. Quem lê é o `sentinela.sh`.
#
# O QUE NÃO ENTRA NA LINHA, DE PROPÓSITO. Nada de `$request` (traz a query
# string, que pode carregar valor digitado pela pessoa) e nada de
# `$remote_addr`. O destino destas linhas é uma mensagem de Telegram; para
# responder "o que quebrou" bastam host, rota e status. O access log padrão
# continua registrando o resto, onde sempre esteve.
#
# `$upstream_status` separa três situações, e os três casos foram observados,
# não deduzidos:
#
#   502  o nginx tentou o proxy e não conseguiu conectar. Foi o que apareceu
#        ao parar o contêiner do site em produção para validar esta fase.
#   500  a aplicação estava viva e respondeu o erro por conta própria.
#   -    o nginx respondeu sozinho, sem tentar upstream nenhum -- é assim que
#        um `return 500` do próprio nginx aparece.
# ---------------------------------------------------------------------------
map $status $resposta_5xx {
    ~^5     1;
    default 0;
}

log_format erro5xx '$time_iso8601 host=$host status=$status '
                   'metodo=$request_method rota=$uri '
                   'upstream=$upstream_status tempo=$request_time';

access_log /var/log/nginx/erro5xx.log erro5xx if=$resposta_5xx;
