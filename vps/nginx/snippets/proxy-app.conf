# Cabeçalhos de proxy comuns aos quatro aplicativos.
# Usado como `include snippets/proxy-app.conf;` dentro de cada `location`.
#
# O snippet mantém uma única definição para os dois `location` de cada vhost
# (raiz e login com limitador), evitando divergência entre proxies.
#
# `proxy_pass` NÃO entra aqui: é a única linha que muda entre os aplicativos,
# e é ela que precisa ficar visível no arquivo de cada vhost.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;
