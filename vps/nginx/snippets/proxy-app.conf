# Cabeçalhos de proxy comuns aos aplicativos.
# Usado como `include snippets/proxy-app.conf;` dentro de cada `location` que
# faz `proxy_pass`.
#
# O snippet mantém uma única definição para os dois `location` de cada vhost
# (raiz e login com limitador), evitando divergência entre proxies.
#
# `proxy_pass` NÃO entra aqui: é a única linha que muda entre os aplicativos,
# e é ela que precisa ficar visível no arquivo de cada vhost.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;

# HSTS TEM UMA FONTE SÓ: o `add_header` do bloco `server` de cada vhost. O que a
# aplicação mandar é descartado aqui.
#
# POR QUE (15/09/2026): os aplicativos Django emitem o próprio HSTS pelo
# `SecurityMiddleware`, com `includeSubDomains; preload`, e o nginx acrescentava
# o dele, só com `max-age`. O navegador recebia dois cabeçalhos discordantes e
# considerava o primeiro. Esconder aqui, e não só nos vhosts de Django, dispensa
# saber qual aplicativo é Django: um aplicativo novo que emita HSTS já nasce
# coberto, e o `tests/nginx_test.sh` confere que todo `proxy_pass` passa por
# este snippet.
proxy_hide_header Strict-Transport-Security;
