# Cabeçalhos de proxy comuns aos quatro aplicativos.
# Usado como `include snippets/proxy-app.conf;` dentro de cada `location`.
#
# POR QUE VIROU SNIPPET: cada vhost passou a ter dois `location` (a raiz e o
# login com limitador). Sem isto, o mesmo bloco de seis linhas ficaria
# repetido oito vezes em quatro arquivos, e a próxima alteração seria feita em
# sete dos oito lugares. É exatamente o mecanismo de deriva que estas rodadas
# de manutenção existem para eliminar.
#
# `proxy_pass` NÃO entra aqui: é a única linha que muda entre os aplicativos,
# e é ela que precisa ficar visível no arquivo de cada vhost.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 90s;
